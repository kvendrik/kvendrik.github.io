<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Bodega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Allo ships with the brand guide (fonts/AlloVariable.woff2). Falls back to system-ui if the file is absent. */
  @font-face { font-family: "Allo"; src: url("fonts/AlloVariable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }

  :root {
    --black:#000; --white:#fff;
    --surface-100:#fff; --surface-200:#f2f2f2;
    --ink:#000; --ink-muted:#595959; --line:#000; --line-soft:#767676;
    --fill:#000; --on-fill:#fff; --field:#fff; --focus:#000;
    --shadow-hard:6px 6px 0 0 #000; --shadow-hard-sm:3px 3px 0 0 #000;
    --shadow-frame:0 0 0 3px #fff, 0 0 0 4px #000;
    --font-display:"Instrument Serif","Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;
    --font-sans:"Allo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
    --border-thick:3px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-100:#000; --surface-200:#141414;
      --ink:#fff; --ink-muted:#a6a6a6; --line:#fff; --line-soft:#8a8a8a;
      --fill:#fff; --on-fill:#000; --field:#000; --focus:#fff;
      --shadow-hard:6px 6px 0 0 #fff; --shadow-hard-sm:3px 3px 0 0 #fff;
      --shadow-frame:0 0 0 3px #000, 0 0 0 4px #fff;
    }
  }

  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--surface-100); color:var(--ink); font:400 16px/24px var(--font-sans); font-variation-settings:"ROND" 0; }
  .wrap { max-width:560px; margin:0 auto; padding:0 var(--space-4) var(--space-12); }

  /* Awning */
  .awning { height:72px; margin:0 calc(var(--space-4) * -1); border:var(--border-thick) solid var(--line); border-bottom:0;
    background:
      radial-gradient(circle at 16px 0,var(--fill) 15.5px,transparent 16px) 0 100%/64px 16px repeat-x,
      radial-gradient(circle at 16px 0,var(--surface-100) 12.5px,var(--line) 13px 16px,transparent 16.5px) 32px 100%/64px 16px repeat-x,
      repeating-linear-gradient(90deg,var(--fill) 0 32px,var(--surface-100) 32px 64px) 0 0/100% calc(100% - 16px) no-repeat; }
  @media (min-width:600px) { .awning { margin:0; } }

  header { text-align:center; padding:var(--space-8) 0 var(--space-6); }
  .wordmark { margin:0; font:italic 400 72px/72px var(--font-display); letter-spacing:-.01em; text-transform:uppercase; }
  .tagline { margin:var(--space-2) 0 0; font:italic 400 28px/34px var(--font-display); color:var(--ink-muted); }

  .label { font:700 12px/16px var(--font-sans); font-variation-settings:"ROND" 0; letter-spacing:.18em; text-transform:uppercase; }

  .panel { margin:4px; padding:var(--space-6); background:var(--surface-100); border:var(--border-thick) solid var(--line); box-shadow:var(--shadow-frame); }
  .panel__title { margin:0 0 var(--space-3); font:400 44px/46px var(--font-display); }
  .muted { color:var(--ink-muted); }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); padding:var(--space-3) var(--space-6);
    background:var(--fill); color:var(--on-fill); border:var(--border-thick) solid var(--line); border-radius:0; box-shadow:var(--shadow-hard-sm);
    font:700 12px/16px var(--font-sans); font-variation-settings:"ROND" 0; letter-spacing:.18em; text-transform:uppercase; cursor:pointer; }
  .btn:hover { box-shadow:var(--shadow-hard); transform:translate(-3px,-3px); }
  .btn:active { box-shadow:none; transform:translate(3px,3px); }
  .btn:focus-visible, .input:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
  .btn--quiet { background:var(--surface-100); color:var(--ink); }
  .btn--danger { background:var(--surface-100); color:var(--ink); border-style:dashed; }
  .btn--block { width:100%; }
  .btn[disabled] { background:var(--surface-200); color:var(--ink-muted); border-color:var(--line-soft); border-style:dotted; box-shadow:none; transform:none; cursor:not-allowed; }

  .input { flex:1; min-width:0; font:400 16px/24px var(--font-sans); padding:var(--space-3) var(--space-4); background:var(--field); color:var(--ink); border:var(--border-thick) solid var(--line); border-radius:0; }
  .input::placeholder { color:var(--ink-muted); }

  .bar { display:flex; justify-content:space-between; align-items:center; gap:var(--space-4); margin:var(--space-4) 0; }
  .chip { display:inline-flex; align-items:center; gap:var(--space-2); padding:var(--space-1) var(--space-3); border:var(--border-thick) solid var(--line); border-radius:999px; box-shadow:var(--shadow-hard-sm); background:var(--fill); color:var(--on-fill); max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  form { display:flex; gap:var(--space-3); margin:var(--space-6) 0; }

  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; justify-content:space-between; align-items:center; gap:var(--space-4); padding:var(--space-3) 0; border-top:1px dashed var(--line-soft); }
  li:first-child { border-top:0; }
  li span { overflow-wrap:anywhere; }

  .status { margin-top:var(--space-4); min-height:24px; font:700 14px/20px var(--font-sans); }
  .step { animation:step 120ms steps(4,end) both; }
  @keyframes step { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .step { animation:none; } .btn:hover, .btn:active { transform:none; } }
  @media (max-width:420px) { .wordmark { font-size:56px; line-height:56px; } .panel__title { font-size:36px; line-height:38px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="awning" aria-hidden="true"></div>
  <header>
    <h1 class="wordmark">Bodega</h1>
    <p class="tagline">No questions asked.</p>
  </header>

  <main>
    <section id="loading" class="panel"><p class="label" style="margin:0">One moment.</p></section>

    <section id="signed-out" class="panel step" hidden>
      <h2 class="panel__title">Who sent you?</h2>
      <p class="muted" style="margin:0 0 var(--space-6)">Sign in and the shelf is yours.</p>
      <button class="btn btn--block" id="apple-btn" type="button"> Sign in with Apple</button>
    </section>

    <section id="signed-in" class="step" hidden>
      <div class="bar">
        <span class="chip label" id="who">● OPEN</span>
        <button class="btn btn--quiet" id="signout-btn" type="button">Sign out</button>
      </div>

      <form id="add-form">
        <input class="input" id="body" placeholder="Put something on the shelf" maxlength="2000" required autocomplete="off" aria-label="New note">
        <button class="btn" type="submit">Get it done</button>
      </form>

      <div class="panel">
        <h2 class="panel__title">The shelf</h2>
        <ul id="list"></ul>
        <p id="empty" class="muted" style="margin:0" hidden>Nothing on the shelf.</p>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Publishable key: safe to ship. Row level security keeps each person's notes their own.
  const SUPABASE_URL = "https://ukxogodszvwxzlfxlgtv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gHzuheaiA8gB2MikOqIAFg_qk_-z7kl";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  const say = (msg) => { $("status").textContent = msg || ""; };
  const fail = (e) => say("✕ " + ((e && e.message) || "Can't find it."));

  async function loadNotes() {
    const { data, error } = await sb.from("notes").select("id, body").order("created_at", { ascending: false });
    if (error) return fail(error);
    const list = $("list");
    list.replaceChildren();
    for (const n of data) {
      const li = document.createElement("li");
      const text = document.createElement("span");
      text.textContent = n.body;
      const del = document.createElement("button");
      del.type = "button";
      del.className = "btn btn--danger";
      del.textContent = "Throw it out";
      del.onclick = async () => {
        const { error } = await sb.from("notes").delete().eq("id", n.id);
        if (error) return fail(error);
        say("Gone for good.");
        loadNotes();
      };
      li.append(text, del);
      list.append(li);
    }
    $("empty").hidden = data.length > 0;
  }

  function render(session) {
    $("loading").hidden = true;
    $("signed-out").hidden = !!session;
    $("signed-in").hidden = !session;
    if (session) {
      const u = session.user;
      $("who").textContent = "● " + (u.email || "OPEN");
      loadNotes();
    }
  }

  $("apple-btn").onclick = async () => {
    say("One moment.");
    const { error } = await sb.auth.signInWithOAuth({
      provider: "apple",
      options: { redirectTo: location.origin + location.pathname },
    });
    if (error) fail(error);
  };

  $("signout-btn").onclick = async () => { await sb.auth.signOut(); say(""); };

  $("add-form").onsubmit = async (e) => {
    e.preventDefault();
    const body = $("body").value.trim();
    if (!body) return;
    const { error } = await sb.from("notes").insert({ body });
    if (error) return fail(error);
    $("body").value = "";
    say("Done.");
    loadNotes();
  };

  sb.auth.onAuthStateChange((_event, session) => render(session));
  sb.auth.getSession().then(({ data }) => render(data.session));
</script>
</body>
</html>
