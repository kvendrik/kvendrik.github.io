<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koen Vendrik</title>
    <script>document.documentElement.classList.add('js');</script>
    <link rel="preload" href="fonts/AlloVariable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Allo by Josh Puckett, SIL Open Font License 1.1 (see fonts/Allo-OFL.txt) */
      @font-face {
        font-family: 'Allo';
        src: url('fonts/AlloVariable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: oblique 0deg 10deg;
        font-display: swap;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: 'Allo', system-ui, sans-serif;
        font-weight: 300;
        color: #252525;
        background: #f4f2ed;
      }

      :root {
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }

      .bio {
        position: relative;
        z-index: 1;
        max-width: 32em;
        margin: 0;
        font-size: clamp(18px, 2.2vw, 22px);
        line-height: 1.55;
        text-align: left;
        text-wrap: pretty;
      }

      /* the text fades in once, after the weather is in (see the script at the bottom) */
      .js .bio {
        opacity: 0;
      }

      .js .bio.ready {
        animation: fade 1400ms var(--ease-out) both;
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .bio p {
        margin: 0 0 1em;
      }

      .bio p:last-child {
        margin-bottom: 0;
      }

      /* links and anything that changes with live data share one thin underline */
      .bio a,
      .u,
      .you {
        color: inherit;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.2em;
      }

      .you {
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        cursor: pointer;
      }

      /* hovering "What about you?" fades everything else back */
      .s {
        transition: opacity 200ms ease;
      }

      .bio:has(.you:hover, .you:focus-visible) .s:not(:has(.you)) {
        opacity: 0.4;
      }

      /* Hovering the coding line turns the page into an XP-style desktop with the text
         in a Notepad window. Drawn in CSS (no Microsoft artwork), and it ignores the mouse so
         the hover underneath keeps working. */
      .coding {
        cursor: default;
      }

      .xp {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: 0;
        transition: opacity 180ms ease;
        font-family: Tahoma, 'Segoe UI', Verdana, sans-serif;
        background:
          radial-gradient(120% 60% at 30% 100%, #6bbf3a 0 38%, transparent 38.5%),
          radial-gradient(140% 70% at 85% 105%, #4f9e2c 0 36%, transparent 36.5%),
          radial-gradient(40% 18% at 22% 22%, rgb(255 255 255 / 0.85), transparent 70%),
          radial-gradient(30% 12% at 70% 14%, rgb(255 255 255 / 0.7), transparent 70%),
          linear-gradient(#2c6fdc, #6aa7f0 55%, #a9d1f7);
      }

      body:has(.coding:hover, .coding:focus-visible) .xp {
        opacity: 1;
      }

      .xp-window {
        position: absolute;
        border: 3px solid #0842d8;
        border-top: 0;
        border-radius: 8px 8px 0 0;
        background: #ece9d8;
        box-shadow: 4px 6px 18px rgb(0 0 0 / 0.35);
      }

      /* the real text sits on top of the desktop, inside the Notepad window, without moving */
      body:has(.coding:hover, .coding:focus-visible) .bio {
        z-index: 6;
      }

      .xp-title {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 4px 0 8px;
        border-radius: 7px 7px 0 0;
        background: linear-gradient(#0a5ff0, #3d95ff 8%, #0a5ff0 45%, #0040d0 95%);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        text-shadow: 1px 1px #0a1f6e;
      }

      .xp-title-text {
        flex: 1;
      }

      .xp-btn {
        display: grid;
        place-items: center;
        width: 21px;
        height: 21px;
        border: 1px solid #fff;
        border-radius: 3px;
        background: linear-gradient(#3c8bff, #1c5fe0);
        font-size: 12px;
        line-height: 1;
      }

      .xp-btn.close {
        background: linear-gradient(#e8785a, #c9431f);
      }

      .xp-menu {
        display: flex;
        gap: 14px;
        padding: 3px 8px;
        font-size: 12px;
        color: #000;
      }

      .xp-text {
        margin: 0 2px 2px;
        border: 1px solid #7f9db9;
        background: #fff;
      }

      .xp-taskbar {
        position: absolute;
        inset: auto 0 0;
        display: flex;
        align-items: center;
        height: 32px;
        background: linear-gradient(#3168d5, #4993e6 10%, #2157d7 50%, #1941a5);
      }

      .xp-start {
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 22px 0 14px;
        border-radius: 0 12px 12px 0;
        background: linear-gradient(#3a9a3a, #5fc35f 12%, #3c9c3c 55%, #2c7d2c);
        color: #fff;
        font-size: 17px;
        font-style: italic;
        font-weight: 700;
        text-shadow: 1px 1px 1px rgb(0 0 0 / 0.5);
      }

      .xp-task {
        margin-left: 6px;
        padding: 5px 12px;
        border-radius: 3px;
        background: #1e52b7;
        box-shadow: inset 1px 1px 2px rgb(0 0 0 / 0.4);
        color: #fff;
        font-size: 12px;
      }

      .xp-tray {
        margin-left: auto;
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 14px;
        border-left: 1px solid #1042af;
        background: linear-gradient(#0f8cf0, #13a3f3 10%, #0f84e8 60%, #0b6bd1);
        color: #fff;
        font-size: 12px;
      }

      /* "What about you?": a place for visitors to leave a message */
      :root {
        --blue: #2f7bf5;
      }

      .bio {
        transition:
          opacity 300ms var(--ease-out),
          translate 300ms var(--ease-out);
      }

      /* the intro drifts up as it fades out */
      body.composing .bio {
        opacity: 0;
        translate: 0 -16px;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        body.composing .bio {
          translate: none;
        }
      }

      body.composing .photos {
        visibility: hidden;
      }

      .compose {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 24px;
        cursor: text;
      }

      .compose[hidden] {
        display: none;
      }

      /* the real input is hidden; what's typed is mirrored into .field with our own cursor */
      .compose-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .field {
        width: min(640px, 100%);
        font-size: clamp(22px, 3vw, 30px);
        line-height: 1.4;
        color: #252525;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .caret,
      .flying-caret {
        display: inline-block;
        width: 2px;
        height: 1.15em;
        margin-right: 1px;
        vertical-align: -0.2em;
        border-radius: 1px;
        background: var(--blue);
      }

      .caret {
        animation: blink 1.06s step-end infinite;
      }

      /* stay solid while typing, blink again when idle */
      .field.typing .caret {
        animation: none;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .flying-caret {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 3;
        transform-origin: top left;
        pointer-events: none;
      }

      .placeholder {
        color: rgb(37 37 37 / 0.4);
      }

      .placeholder small,
      .send-hint {
        margin-left: 0.6em;
        font-size: 13px;
        color: rgb(37 37 37 / 0.35);
        white-space: nowrap;
        vertical-align: 0.15em;
      }

      .send-hint {
        opacity: 0;
        transition: opacity 900ms ease;
      }

      .send-hint.shown {
        opacity: 1;
      }

      kbd {
        display: inline-block;
        padding: 0 5px;
        border: 1px solid rgb(37 37 37 / 0.2);
        border-bottom-width: 2px;
        border-radius: 4px;
        font: inherit;
        font-size: 11px;
        line-height: 16px;
      }

      /* Amsterdam photos: hidden until the Amsterdam link is hovered or focused.
         The script below places them in the free space around the text. */
      .photos {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .photos:not(.placed),
      .photo[hidden] {
        display: none;
      }

      .photo {
        position: absolute;
        top: 0;
        left: 0;
        border-radius: 4px;
        overflow: hidden;
        opacity: 0;
        scale: 0.95;
        /* exit: quick, all at once */
        transition:
          opacity 200ms var(--ease-out),
          scale 200ms var(--ease-out);
      }

      .photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* a faint glint of light that slides across the photo as it tilts */
      .photo::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at var(--glint-x, 50%) var(--glint-y, 50%),
          rgb(255 255 255 / 0.35),
          transparent 60%
        );
        mix-blend-mode: soft-light;
        pointer-events: none;
      }

      body:has(.amsterdam:focus-visible) .photo {
        opacity: 1;
        scale: 1;
        /* enter: staggered, order shuffled by the script */
        transition-duration: 400ms;
        transition-delay: var(--delay, calc(var(--i) * 50ms));
      }

      @media (hover: hover) and (pointer: fine) {
        body:has(.amsterdam:hover) .photo {
          opacity: 1;
          scale: 1;
          transition-duration: 400ms;
          transition-delay: var(--delay, calc(var(--i) * 50ms));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .photo {
          scale: none !important;
          transition-property: opacity;
        }
      }
    </style>
  </head>
  <body>

      <div class="photo" style="--i: 1" data-aspect="3/2" data-region="top" data-span="0.05 0.6" data-size="0.8" data-at="0.3 0.4"><img src="photos/tree-canal.webp" alt="" /></div>
      <div class="photo" style="--i: 2" data-aspect="2/3" data-region="right" data-span="0 0.6" data-size="0.8" data-at="0.6 0.15"><img src="photos/stoop.webp" alt="" /></div>

      <div class="photo" style="--i: 4" data-aspect="3/2" data-region="left" data-span="0.5 1" data-size="0.9" data-at="0.6 0.75"><img src="photos/sunny-canal.webp" alt="" /></div>
    </div>
    <script>
      // Time of day: the visitor's own clock
      const hour = new Date().getHours();
      document.getElementById('time-of-day').textContent =
        hour >= 5 && hour < 12 ? 'morning' : hour >= 12 && hour < 18 ? 'afternoon' : 'evening';

      // Weather in Amsterdam right now, from Open-Meteo (free, no key, called from the browser).
      // If it fails, the page keeps "Greetings from Amsterdam!" and skips the weather line.
      const describe = (code, isDay) => {
        if (code <= 1) return isDay ? 'sunny' : 'clear';
        if (code <= 3) return 'cloudy';
        if (code <= 48) return 'foggy';
        if (code <= 57) return 'drizzly';
        if (code <= 67 || (code >= 80 && code <= 82)) return 'rainy';
        if (code <= 86) return 'snowy';
        return 'stormy';
      };

      // one word for the greeting: "Greetings from wet Amsterdam!"
      const greetingWord = (weather, temp) => {
        if (weather === 'drizzly' || weather === 'rainy' || weather === 'stormy') return 'wet';
        if (weather === 'snowy') return 'snowy';
        if (weather === 'sunny' && temp >= 12) return 'sunny';
        if (temp >= 18) return 'warm';
        if (temp <= 12) return 'cold';
        return weather === 'foggy' ? 'foggy' : 'grey';
      };

      const underlined = (text) => {
        const span = document.createElement('span');
        span.className = 'u';
        span.textContent = text;
        return span;
      };

      const weatherReady = fetch(
        'https://api.open-meteo.com/v1/forecast?latitude=52.37&longitude=4.89' +
          '&current=temperature_2m,weather_code,is_day&timezone=Europe%2FAmsterdam',
      )
        .then((res) => (res.ok ? res.json() : Promise.reject(res.status)))
        .then(({ current }) => {
          // too late: the opening line is already showing, so don't change it mid-read
          if (document.querySelector('.bio').classList.contains('ready')) return;
          const temp = Math.round(current.temperature_2m);
          const isDay = current.is_day === 1;
          const weather = describe(current.weather_code, isDay);

          // keep the same Amsterdam link element so the photo hover keeps working
          const link = document.querySelector('.amsterdam');
          document
            .getElementById('weather')
            .replaceChildren('Greetings from ', underlined(greetingWord(weather, temp)), ' ', link, '! ');

        })
        .catch(() => {});
    </script>
    <script>
      const amsterdam = document.querySelector('.amsterdam');
      const photos = [...document.querySelectorAll('.photo')];

      // Layout: measure where the text is, split the free space around it into
      // regions (left and right columns, bands above and below), and fit each photo
      // into its share of a region. Photos shrink to fit and are skipped if too small.
      const bio = document.querySelector('.bio');
      const container = document.querySelector('.photos');
      const GAP = 48; // keeps photos clear of the text, even while they drift with the mouse
      const EDGE = 16;
      const MIN_WIDTH = 64;
      const MAX_WIDTH = 500;

      function layout() {
        const W = innerWidth;
        const H = innerHeight;
        const t = bio.getBoundingClientRect();
        const regions = {
          left: { x: 0, y: 0, w: t.left - GAP, h: H, split: 'y' },
          right: { x: t.right + GAP, y: 0, w: W - t.right - GAP, h: H, split: 'y' },
          top: { x: t.left, y: 0, w: t.width, h: t.top - GAP, split: 'x' },
          bottom: { x: t.left, y: t.bottom + GAP, w: t.width, h: H - t.bottom - GAP, split: 'x' },
        };

        for (const photo of photos) {
          const r = regions[photo.dataset.region];
          const [from, to] = photo.dataset.span.split(' ').map(Number);
          const [fx, fy] = photo.dataset.at.split(' ').map(Number);
          const [aw, ah] = photo.dataset.aspect.split('/').map(Number);
          const aspect = aw / ah;

          // this photo's cell within its region
          const cell =
            r.split === 'y'
              ? { x: r.x, y: r.y + r.h * from, w: r.w, h: r.h * (to - from) }
              : { x: r.x + r.w * from, y: r.y, w: r.w * (to - from), h: r.h };
          const availW = cell.w - EDGE * 2;
          const availH = cell.h - EDGE * 2;
          const width = Math.min(MAX_WIDTH, availW * Number(photo.dataset.size), availW, availH * aspect);

          // never cover the text: a photo that can't fit beside it is left out
          // (TODO: a proper layout for small screens)
          if (width < MIN_WIDTH) {
            photo.hidden = true;
            continue;
          }
          const height = width / aspect;
          photo.hidden = false;
          photo.style.width = `${width}px`;
          photo.style.height = `${height}px`;
          photo.style.left = `${cell.x + EDGE + fx * (availW - width)}px`;
          photo.style.top = `${cell.y + EDGE + fy * (availH - height)}px`;
        }

        // parallax depth: bigger photos feel closer, so they move more
        const shown = photos.filter((p) => !p.hidden);
        const widest = Math.max(...shown.map((p) => p.offsetWidth), 1);
        for (const p of shown) p.dataset.depth = ((p.offsetWidth / widest) ** 1.5).toFixed(3);
        container.classList.add('placed');
      }

      // re-run when the window changes or the text reflows (e.g. once the weather loads)
      new ResizeObserver(layout).observe(bio);
      // the story scrolls as it's revealed, so measure again right before the photos show
      amsterdam.addEventListener('pointerenter', layout);
      amsterdam.addEventListener('focus', layout);
      addEventListener('resize', layout);

      // Fade-in order: shuffled every time, never starting with the same photo twice in a row.
      // Shuffled ahead of the hover: a delay set during the hover itself would be too late.
      let lastFirst = null;
      function shuffleDelays() {
        let order;
        do {
          order = photos.slice().sort(() => Math.random() - 0.5);
        } while (order[0] === lastFirst);
        lastFirst = order[0];

        let delay = 0;
        for (const photo of order) {
          photo.style.setProperty('--delay', `${Math.round(delay)}ms`);
          delay += 20 + Math.random() * 90;
        }
      }
      shuffleDelays();
      amsterdam.addEventListener('pointerleave', shuffleDelays);
      amsterdam.addEventListener('blur', shuffleDelays);

      // Parallax: as the mouse moves over "Amsterdam", each photo drifts a few pixels
      // and tilts a few degrees in 3D, each in its own direction, with a glint of light
      // sliding across it. Every photo trails the pointer a little so it feels alive.
      const canParallax =
        matchMedia('(hover: hover) and (pointer: fine)').matches &&
        !matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (canParallax) {
        const MAX_SHIFT = 6; // px
        const MAX_TILT = 4; // degrees
        const layers = photos.map((photo) => {
          const angle = Math.random() * Math.PI * 2; // this photo's own direction
          return { photo, cos: Math.cos(angle), sin: Math.sin(angle), x: 0, y: 0 };
        });

        let targetX = 0;
        let targetY = 0;
        let frame = null;
        let last = 0;

        addEventListener('pointermove', (e) => {
          // -1..1 across the Amsterdam link: the photos only show while it's hovered,
          // so moving over the word itself sweeps them through their full range
          const r = amsterdam.getBoundingClientRect();
          const clamp = (v) => Math.max(-1, Math.min(1, v));
          targetX = clamp((e.clientX - (r.left + r.width / 2)) / (r.width / 2 + 16));
          targetY = clamp((e.clientY - (r.top + r.height / 2)) / (r.height / 2 + 24));
          if (!frame) {
            last = performance.now();
            frame = requestAnimationFrame(tick);
          }
        });

        function tick(now) {
          const dt = Math.min(now - last, 64);
          last = now;
          // frame-rate independent easing towards the target
          const ease = 1 - Math.exp(-dt / 160);
          let moving = false;
          for (const l of layers) {
            // the mouse direction, turned to this photo's own angle
            const tx = targetX * l.cos - targetY * l.sin;
            const ty = targetX * l.sin + targetY * l.cos;
            l.x += (tx - l.x) * ease;
            l.y += (ty - l.y) * ease;
            if (Math.abs(tx - l.x) > 0.001 || Math.abs(ty - l.y) > 0.001) moving = true;

            const depth = 0.5 + 0.5 * Number(l.photo.dataset.depth || 0);
            const sx = (l.x * MAX_SHIFT * depth).toFixed(2);
            const sy = (l.y * MAX_SHIFT * depth).toFixed(2);
            l.photo.style.translate = `${sx}px ${sy}px`;
            l.photo.style.transform =
              `perspective(800px) rotateY(${(l.x * MAX_TILT).toFixed(2)}deg) rotateX(${(-l.y * MAX_TILT).toFixed(2)}deg)`;
            l.photo.style.setProperty('--glint-x', `${(50 + l.x * 45).toFixed(1)}%`);
            l.photo.style.setProperty('--glint-y', `${(50 + l.y * 45).toFixed(1)}%`);
          }
          frame = moving ? requestAnimationFrame(tick) : null;
        }
      }
    </script>
    <script>
      // "What about you?": the rest of the page fades away and a blue cursor flies from the
      // end of the question to the middle of the page, where the visitor can type a message.
      const you = document.querySelector('.you');
      const compose = document.querySelector('.compose');
      const input = compose.querySelector('.compose-input');
      const field = compose.querySelector('.field');
      const typed = field.querySelector('.typed');
      const caret = field.querySelector('.caret');
      const placeholder = field.querySelector('.placeholder');
      const sendHint = field.querySelector('.send-hint');
      const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
      const MOVE = 'cubic-bezier(0.77, 0, 0.175, 1)'; // on-screen movement
      const OUT = 'cubic-bezier(0.23, 1, 0.32, 1)'; // entering and leaving

      const steps = {
        message: {
          placeholder: 'What about you?<small><kbd>Esc</kbd> to go back</small>',
          minWords: 3,
        },
        contact: {
          placeholder: 'And where can I reach you?<small><kbd>Esc</kbd> to go back</small>',
          minWords: 1,
        },
      };
      let step = null; // 'message' | 'contact' | 'sent'
      let note = {};

      // TODO: deliver messages somewhere (Formspree, a small worker…). Not wired up yet.
      async function deliver(message) {
        console.info('Message for Koen (not sent anywhere yet):', message);
      }

      function render() {
        const value = input.value;
        typed.textContent = value;
        placeholder.hidden = value.length > 0;
        // the send hint only takes up space once something's typed
        sendHint.hidden = value.length === 0 || step === 'sent';
        const words = value.trim() ? value.trim().split(/\s+/).length : 0;
        sendHint.classList.toggle('shown', step in steps && words >= steps[step].minWords);
      }

      function goTo(name, { fade = true } = {}) {
        step = name;
        input.value = '';
        placeholder.innerHTML = steps[name].placeholder;
        sendHint.classList.remove('shown');
        render();
        if (fade) placeholder.animate({ opacity: [0, 1] }, { duration: 300, easing: OUT });
      }

      // keep the (hidden) input's cursor at the end, so our cursor is always right
      const keepAtEnd = () => input.setSelectionRange(input.value.length, input.value.length);

      let idleTimer;
      input.addEventListener('input', () => {
        keepAtEnd();
        render();
        field.classList.add('typing');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => field.classList.remove('typing'), 600);
      });
      input.addEventListener('select', keepAtEnd);

      // clicking anywhere keeps the focus in the message
      compose.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        input.focus();
      });

      function openCompose() {
        compose.hidden = false;
        caret.hidden = false;
        goTo('message', { fade: false });
        caret.style.opacity = 0;
        placeholder.style.opacity = 0;
        document.body.classList.add('composing');

        // fly a cursor from just after "What about you?" to where the real one sits
        const from = you.getBoundingClientRect();
        const to = caret.getBoundingClientRect();
        const flyer = document.createElement('span');
        flyer.className = 'flying-caret';
        flyer.style.height = `${to.height}px`;
        document.body.append(flyer);
        const startScale = (from.height * 0.85) / to.height;
        const startX = from.right + 2;
        const startY = from.top + (from.height - to.height * startScale) / 2;

        flyer
          .animate(
            {
              transform: [
                `translate(${startX}px, ${startY}px) scaleY(${startScale})`,
                `translate(${to.left}px, ${to.top}px) scaleY(1)`,
              ],
            },
            { duration: reduceMotion() ? 0 : 700, easing: MOVE, fill: 'forwards' },
          )
          .finished.then(() => {
            flyer.remove();
            caret.style.opacity = '';
            placeholder.style.opacity = '';
            placeholder.animate({ opacity: [0, 1] }, { duration: 300, easing: OUT });
          });
        input.focus();
      }

      function closeCompose() {
        step = null;
        input.blur();
        compose
          .animate({ opacity: [1, 0] }, { duration: 300, easing: OUT })
          .finished.then(() => (compose.hidden = true));
        document.body.classList.remove('composing');
      }

      you?.addEventListener('click', openCompose);

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') return closeCompose();
        if (e.key !== 'Enter' || e.shiftKey) return;
        e.preventDefault();

        const value = input.value.trim();
        if (step === 'message') {
          if (!value) return;
          note = { message: value };
          goTo('contact');
        } else if (step === 'contact') {
          if (!value) return; // a way to reply is required
          note.contact = value;
          deliver(note);
          step = 'sent';
          input.value = '';
          caret.hidden = true;
          render();
          placeholder.hidden = true;
          typed.textContent = "Thank you! I'll get back to you soon.";
          typed.animate({ opacity: [0, 1] }, { duration: 300, easing: OUT });
          setTimeout(closeCompose, 2400);
        }
      });
    </script>
    <script>
      // Fade the text in once the weather is in (at most 1.5s), so the opening line doesn't
      // change while someone's reading it.
      Promise.race([weatherReady, new Promise((r) => setTimeout(r, 1500))]).then(() =>
        document.querySelector('.bio').classList.add('ready'),
      );
    </script>
    <script>
      // Fit the Notepad window around the text where it already is, and set the taskbar clock.
      (() => {
        const coding = document.querySelector('.coding');
        const bio = document.querySelector('.bio');
        const win = document.querySelector('.xp-window');
        const textArea = win.querySelector('.xp-text');
        const PAD = 14; // white space around the text inside the window

        const fit = () => {
          const r = bio.getBoundingClientRect();
          const chrome = win.querySelector('.xp-title').offsetHeight + win.querySelector('.xp-menu').offsetHeight;
          const inset = 3 + 2 + 1 + PAD; // window border + margin + text area border + padding
          win.style.left = `${r.left - inset}px`;
          win.style.top = `${r.top - PAD - 1 - chrome}px`;
          win.style.width = `${r.width + inset * 2}px`;
          textArea.style.height = `${r.height + PAD * 2 + 40}px`;
          document.querySelector('.xp-tray').textContent = new Date().toLocaleTimeString([], {
            hour: 'numeric',
            minute: '2-digit',
          });
        };
        coding.addEventListener('pointerenter', fit);
        coding.addEventListener('focus', fit);
        addEventListener('resize', fit);
      })();
    </script>
  </body>
</html>
